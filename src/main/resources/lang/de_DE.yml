  close:
    none-active: "Du hast kein aktives Ticket zum Schließen."
    success: "<color:#ED4245>Ticket #%id% geschlossen.</color>"
  cancel:
    none-active: "Du hast kein aktives Ticket zum Abbrechen."
    success: "<color:#ED4245>Ticket #%id% abgebrochen.</color>"
