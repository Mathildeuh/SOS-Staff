    ticket-lore: "<gray>%category%</gray> <dark_gray>|</dark_gray> <white>%status%</white> <dark_gray>|</dark_gray> <yellow>%priority%</yellow>"
    filter-all: "<color:#57F287>Alle Tickets</color>"

admin:
