name: Dev Build

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload numbered dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOS-Staff-dev-${{ github.run_number }}
          path: build/libs/*.jar
          retention-days: 30
